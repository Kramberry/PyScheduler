{# Expects `active` ('schedule' | 'team' | 'export') and optionally
   `banner_settings` (true on pages that include _banners.html). #}
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}" aria-label="ShiftDesk home">
    {# Printer's registration mark #}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="12" cy="12" r="6.5"/>
      <path d="M12 1.5v21M1.5 12h21" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
    </svg>
    <span>ShiftDesk</span>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="{{ url_for('index') }}" {% if active == 'schedule' %}aria-current="page"{% endif %}>Schedule</a>
    <a href="{{ url_for('manage_employees') }}" {% if active == 'team' %}aria-current="page"{% endif %}>Team &amp; roles</a>
  </nav>
  <div class="topbar-tools">
    {% if banner_settings %}
    <button type="button" class="icon-btn" onclick="openSettings()" title="Side banners" aria-label="Side banner settings">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M3 16l5-5 4 4 3-3 6 6" stroke-linejoin="round"/>
        <circle cx="15.5" cy="8.5" r="1.5"/>
      </svg>
    </button>
    {% endif %}
    <button type="button" id="dark-toggle" class="icon-btn" onclick="toggleDark()" title="Switch light/dark" aria-label="Switch light or dark mode">
      <svg id="icon-sun" class="hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path stroke-linecap="round" d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
      </svg>
      <svg id="icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
      </svg>
    </button>
  </div>
</header>
<script>
  function syncThemeIcons() {
    const isDark = document.documentElement.classList.contains('dark');
    document.getElementById('icon-sun').classList.toggle('hidden', !isDark);
    document.getElementById('icon-moon').classList.toggle('hidden', isDark);
  }
  function toggleDark() {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    syncThemeIcons();
  }
  syncThemeIcons();
</script>
